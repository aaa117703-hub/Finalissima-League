<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finalissima League Chat</title>

    <meta name="color-scheme" content="only light">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="theme.css">
</head>
<body>

    <div class="container">

        <!-- HEADER -->
        <header class="header">
            <h1 class="title">FINALISSIMA<br><span>LEAGUE CHAT</span></h1>
            <p class="subtitle">Fantasy Football - 20 Nations</p>
        </header>

        <!-- ROUND SELECTOR -->
        <section class="round-bar">
            <button class="nav-arrow" id="prevRound">&#8249;</button>
            <select id="roundSelector" class="round-selector">
                <option value="1">Round 1</option>
            </select>
            <button class="nav-arrow" id="nextRound">&#8250;</button>
        </section>

        <!-- TABS -->
        <nav class="tabs">
            <button class="tab-btn active" data-tab="fixtures">Fixtures</button>
            <button class="tab-btn" data-tab="standings">Standings</button>
            <button class="tab-btn" data-tab="totw">TOTW</button>
            <button class="tab-btn" data-tab="stats">Stats</button>
        </nav>

        <!-- TAB CONTENT -->
        <main class="tab-content">

            <!-- FIXTURES -->
            <section class="tab-pane active" id="tab-fixtures">
                <div id="fixturesContainer"></div>
            </section>

            <!-- STANDINGS -->
            <section class="tab-pane" id="tab-standings">
                <div id="standingsContainer"></div>
            </section>

            <!-- TOTW -->
            <section class="tab-pane" id="tab-totw">
                <div id="totwContainer"></div>
            </section>

            <!-- STATS -->
            <section class="tab-pane" id="tab-stats">
                <div class="stats-tabs">
                    <button class="stats-tab active" data-stats="overview">Overview</button>
                    <button class="stats-tab" data-stats="charts">Charts</button>
                    <button class="stats-tab" data-stats="clubs">Clubs</button>
                    <button class="stats-tab" data-stats="search">Search</button>
                </div>
                <div id="statsContainer"></div>
            </section>

        </main>

        <!-- FOOTER -->
        <footer class="footer">
            <p>Made by <strong>Aqeel Al Rowai</strong> - Finalissima</p>
        </footer>

    </div>

    <!-- TOAST -->
    <div class="toast" id="toast">
        <div id="toastContent"></div>
    </div>

    <!-- MAINTENANCE OVERLAY -->
    <div id="sectionMaintenance" class="maintenance-overlay">
        <div class="maint-box">
            <h2>MAINTENANCE</h2>
            <p>This section is currently locked.</p>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-box">
            <div class="settings-header">
                <span>SETTINGS</span>
                <button class="close-btn" id="closeSettings">×</button>
            </div>
            <div class="settings-body" id="settingsBody"></div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="js/teams.js"></script>
    <script src="js/matchweeks.js"></script>
    <script src="js/players-teams.js"></script>
    <script src="js/main.js"></script>
    <script src="js/fixtures.js"></script>
    <script src="js/standings.js"></script>
    <script src="js/totw.js"></script>
    <script src="js/stats.js"></script>

</body>
</html>
