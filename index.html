<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finalissima League Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-title">FINALISSIMA</div>
    </header>

    <!-- MAIN -->
    <main class="container">

        <!-- 4 CARDS (2x2) -->
        <section class="landing-grid">
            <a href="?tab=fixtures" class="landing-card">
                <div class="landing-icon">⚔️</div>
                <div class="landing-label">FIXTURES</div>
                <div class="landing-desc">Matchweek Battles</div>
            </a>
            <a href="?tab=standings" class="landing-card">
                <div class="landing-icon">🏆</div>
                <div class="landing-label">STANDINGS</div>
                <div class="landing-desc">League Table</div>
            </a>
            <a href="?tab=totw" class="landing-card">
                <div class="landing-icon">⭐</div>
                <div class="landing-label">TOTW</div>
                <div class="landing-desc">Team of the Week</div>
            </a>
            <a href="?tab=stats" class="landing-card">
                <div class="landing-icon">📊</div>
                <div class="landing-label">STATS</div>
                <div class="landing-desc">Statistics & Charts</div>
            </a>
        </section>

        <!-- CTA -->
        <section class="landing-cta">
            <a href="?tab=fixtures" class="btn btn-gold btn-block">🏆 ENTER LEAGUE</a>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>Made by <strong>Ehab Mo</strong> · Finalissima</p>
    </footer>

    <!-- TOAST -->
    <div class="toast" id="toast">
        <div id="toastContent"></div>
    </div>

    <!-- MAINTENANCE OVERLAY -->
    <div id="sectionMaintenance" class="maintenance-overlay">
        <div class="maint-box">
            <h2>🔒 MAINTENANCE</h2>
            <p>This section is currently locked.</p>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-box">
            <div class="settings-header">
                <span>⚙️ SETTINGS</span>
                <button class="close-btn" id="closeSettings">×</button>
            </div>
            <div class="settings-body" id="settingsBody"></div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="js/teams.js"></script>

</body>
</html>
